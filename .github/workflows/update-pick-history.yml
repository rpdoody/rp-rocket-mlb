name: Capture and grade MLB pick history

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pick-history:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pick-history dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow streamlit requests MLB-StatsAPI pybaseball

      - name: Capture qualifying pregame picks
        run: python scripts/capture_pick_history.py

      - name: Grade completed picks
        run: python scripts/grade_pick_history.py

      - name: Commit pick-history changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_files/processed/pick_history_2026.parquet
          git diff --cached --quiet || git commit -m "Update MLB pick history"
          git push
