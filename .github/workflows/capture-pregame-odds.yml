name: Capture pregame MLB odds

on:
  workflow_dispatch:
  schedule:
    # Five snapshots daily during EDT:
    # 11:07 AM, 2:07 PM, 5:07 PM, 8:07 PM, and 11:07 PM Eastern.
    # Each run requests 3 markets × 1 US region ≈ 3 credits.
    # Estimated maximum: 5 × 3 × 30 = 450 credits/month.
    - cron: "7 15,18,21 * 4-10 *"
    - cron: "7 0,3 * 4-10 *"

permissions:
  contents: write

concurrency:
  group: rp-rocket-mlb-data-writers
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests

      - name: Capture odds snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/capture_pregame_odds.py

      - name: Commit updated odds history
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data_files/processed/pregame_odds_snapshots.parquet

          if [ -f data_files/processed/odds_api_quota.json ]; then
            git add data_files/processed/odds_api_quota.json
          fi

          if git diff --cached --quiet; then
            echo "No new odds data to commit."
            exit 0
          fi

          git commit -m "Capture pregame odds snapshot"
          git push origin HEAD:main
          git pull --rebase origin main
          git push origin HEAD:main
