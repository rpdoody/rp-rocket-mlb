name: Update live MLB gameinfo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gameinfo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow MLB-StatsAPI

      - name: Fetch completed MLB games
        run: python scripts/fetch_live_gameinfo.py

      - name: Commit updated live gameinfo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_files/processed/live_gameinfo_2026.parquet
          git diff --cached --quiet || git commit -m "Update live MLB gameinfo"
          git push
